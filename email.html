<!doctype html>
<html lang="en" data-tff-shell="off">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a1628" />
    <title>July 8 Email · TFF × TheraBreath</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/tff-guest.css" />
    <style>
      .guest-page--email { width: min(520px, calc(100vw - 32px)); }
      .guest-lead { margin: 0 0 18px; font-size: 0.88rem; line-height: 1.55; color: var(--muted); }
      .guest-download {
        display: block; padding: 16px 18px; margin-bottom: 16px; border-radius: 12px;
        text-decoration: none; color: inherit;
        border: 1px solid rgba(0, 143, 211, 0.35);
        background: linear-gradient(135deg, #fff, #f0f9fd);
      }
      .guest-download b { display: block; font-family: "Sora", sans-serif; font-size: 0.92rem; margin-bottom: 3px; }
      .guest-download span { font-size: 0.78rem; color: var(--muted); }
      .guest-copy {
        margin-bottom: 16px; padding: 14px 16px; border-radius: 12px;
        background: #f8fafc; border: 1px solid var(--line);
        font-size: 0.8rem; line-height: 1.55; white-space: pre-wrap;
      }
      .guest-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
      .guest-actions a, .guest-actions button {
        padding: 9px 14px; border-radius: 999px; font-family: "Sora", sans-serif;
        font-size: 0.72rem; font-weight: 700; text-decoration: none;
        border: 1px solid var(--line); background: #fff; cursor: pointer;
      }
      .guest-actions .primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    </style>
  </head>
  <body>
    <main class="guest-page guest-page--email">
      <p class="guest-kicker">Internal</p>
      <h1>July 8 email</h1>
      <p class="guest-sub">Attach PDF + Word · copy · send</p>

      <a class="guest-download" href="/booklet/documents/july-8-briefing.pdf" download="july-8-briefing.pdf">
        <b>july-8-briefing.pdf</b>
        <span>2 pages · attach to email</span>
      </a>
      <a class="guest-download" href="/booklet/documents/july-8-briefing.docx" download="july-8-briefing.docx">
        <b>july-8-briefing.docx</b>
        <span>Editable Word · attach with PDF</span>
      </a>

      <p class="guest-label">Subject</p>
      <div class="guest-copy" id="email-subject"></div>

      <p class="guest-label">Body</p>
      <div class="guest-copy" id="email-blurb"></div>
      <div class="guest-actions">
        <button type="button" class="primary" id="copy-blurb">Copy body</button>
        <button type="button" id="copy-subject">Copy subject</button>
        <a href="/booklet/documents/july-8-briefing.pdf">Open PDF</a>
        <a href="/booklet/documents/july-8-briefing.docx">Open Word</a>
      </div>
    </main>
    <script>
      (function () {
        var subject = "See you July 8 in Norco";
        var blurb =
          "TheraBreath team,\n\n" +
          "We're excited to welcome you July 8 for Breath of Innovation at The Flavor Factory.\n\n" +
          "Attached are your briefing PDF and an editable Word version — schedule, sessions, and how to get the most from the day. Arrive 9:00 AM, 2058 Second Street (tour first; session 9:30). Closed-toe shoes.\n\n" +
          "Thank you for making time for this. We built the day around your priorities and look forward to a great working session together.\n\n" +
          "(951) 273-9877 anytime before the visit.\n\n" +
          "With appreciation,\n" +
          "The Flavor Factory";
        document.getElementById("email-subject").textContent = subject;
        document.getElementById("email-blurb").textContent = blurb;
        document.getElementById("copy-blurb").onclick = function () {
          navigator.clipboard.writeText(blurb).then(function () {
            var b = document.getElementById("copy-blurb");
            b.textContent = "Copied";
            setTimeout(function () { b.textContent = "Copy body"; }, 2000);
          });
        };
        document.getElementById("copy-subject").onclick = function () {
          navigator.clipboard.writeText(subject).then(function () {
            var b = document.getElementById("copy-subject");
            b.textContent = "Copied";
            setTimeout(function () { b.textContent = "Copy subject"; }, 2000);
          });
        };
      })();
    </script>
  </body>
</html>
