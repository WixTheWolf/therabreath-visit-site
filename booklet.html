<!doctype html>
<html lang="en" data-tff-shell="native">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="TheraBreath × TFF July 8 visit packet — suggested agenda, discussion prep, and indexed materials for the Norco capabilities workshop." />
    <meta name="theme-color" content="#0a1628" />
    <title>July 8 Visit Packet | TFF × TheraBreath</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/tff-shell.css" />
    <style>
      :root {
        --blue: #008fd3;
        --green: #5fb832;
        --orange: #f58220;
        --ink: #0a1628;
        --muted: #5c6678;
        --line: #d8e2ec;
        --paper: #f6fafc;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "DM Sans", system-ui, sans-serif;
        color: var(--ink);
        background: var(--paper);
        -webkit-font-smoothing: antialiased;
      }
      h1, h2, h3, .ch-num, .idx-n, .cover-title { font-family: "Sora", sans-serif; }

      .toolbar {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 12px 20px;
        background: rgba(255, 255, 255, 0.96);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(14px);
      }
      .toolbar span { font-size: 0.84rem; }
      .toolbar div { display: flex; gap: 8px; flex-wrap: wrap; }
      .toolbar a, .toolbar button {
        padding: 9px 16px;
        border-radius: 999px;
        font-family: "Sora", sans-serif;
        font-size: 0.76rem;
        font-weight: 700;
        text-decoration: none;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        cursor: pointer;
      }
      .toolbar button.primary { background: var(--blue); color: #fff; border: none; }

      .book {
        display: grid;
        gap: 28px;
        padding: 28px 20px 32px;
        justify-items: center;
      }

      .page {
        width: 8.5in;
        min-height: 11in;
        padding: 0.55in 0.6in 0.65in;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 4px;
        box-shadow: 0 20px 60px rgba(10, 22, 40, 0.1);
        position: relative;
        overflow: hidden;
        page-break-after: always;
        break-after: page;
      }
      .page::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 5px;
        background: linear-gradient(90deg, var(--blue), var(--green), var(--orange));
      }
      .page-foot {
        position: absolute;
        bottom: 0.42in;
        left: 0.6in;
        right: 0.6in;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.58rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 600;
      }
      .page-foot .pg { font-family: "Sora", sans-serif; color: var(--blue); }

      /* Cover */
      .cover {
        display: grid;
        grid-template-rows: 1fr auto;
        min-height: 9.2in;
        padding-top: 0.2in;
      }
      .cover-top { display: grid; align-content: center; justify-items: center; text-align: center; }
      .cover-mark {
        width: 72px;
        height: 72px;
        display: grid;
        place-items: center;
        border-radius: 20px;
        background: linear-gradient(145deg, var(--ink), var(--blue));
        color: #fff;
        font-family: "Sora", sans-serif;
        font-weight: 800;
        font-size: 1.1rem;
        margin-bottom: 28px;
        box-shadow: 0 16px 40px rgba(0, 143, 211, 0.28);
      }
      .cover-kicker {
        margin: 0 0 12px;
        font-size: 0.68rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--blue);
      }
      .cover-title {
        margin: 0 0 14px;
        font-size: 2.15rem;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1.08;
        max-width: 5.5in;
      }
      .cover-sub {
        margin: 0 auto;
        max-width: 4.8in;
        font-size: 0.92rem;
        line-height: 1.6;
        color: var(--muted);
      }
      .cover-partners {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin-top: 32px;
        font-family: "Sora", sans-serif;
        font-size: 0.78rem;
        font-weight: 700;
      }
      .cover-partners i {
        display: block;
        width: 28px;
        height: 2px;
        background: linear-gradient(90deg, var(--blue), var(--green));
        font-style: normal;
      }
      .cover-bottom {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 20px;
        align-items: end;
        padding-top: 24px;
        border-top: 1px solid var(--line);
      }
      .cover-fields label {
        display: block;
        font-size: 0.6rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .cover-fields .line {
        border-bottom: 1.5px solid var(--ink);
        height: 26px;
        margin-bottom: 14px;
      }
      .cover-qr { text-align: center; }
      .cover-qr img {
        width: 96px;
        height: 96px;
        border-radius: 10px;
        border: 1px solid var(--line);
        padding: 4px;
        background: #fff;
      }
      .cover-qr b {
        display: block;
        margin-top: 6px;
        font-family: "Sora", sans-serif;
        font-size: 0.62rem;
      }
      .cover-qr span { font-size: 0.55rem; color: var(--muted); }

      /* Welcome */
      .kicker {
        margin: 0 0 8px;
        font-size: 0.62rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--blue);
      }
      .page h2 {
        margin: 0 0 16px;
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .lead { margin: 0 0 18px; font-size: 0.84rem; line-height: 1.65; color: #344054; }
      .how-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 20px 0;
      }
      .how-card {
        padding: 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: linear-gradient(160deg, #fff, #f8fcfe);
      }
      .how-card b {
        display: block;
        font-family: "Sora", sans-serif;
        font-size: 0.78rem;
        margin-bottom: 6px;
        color: var(--ink);
      }
      .how-card p { margin: 0; font-size: 0.72rem; line-height: 1.5; color: var(--muted); }

      /* Index */
      .index-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 20px;
        padding-bottom: 12px;
        border-bottom: 2px solid var(--ink);
      }
      .index-head h2 { margin: 0; }
      .index-head span { font-size: 0.72rem; color: var(--muted); }
      .ch-block { margin-bottom: 18px; }
      .ch-label {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 8px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--line);
      }
      .ch-label .ch-num {
        font-size: 1.1rem;
        font-weight: 800;
        color: var(--blue);
        min-width: 28px;
      }
      .ch-label b { font-size: 0.82rem; }
      .ch-label span { font-size: 0.68rem; color: var(--muted); margin-left: auto; }
      .idx-row {
        display: grid;
        grid-template-columns: 32px 1fr auto auto;
        gap: 8px;
        align-items: baseline;
        padding: 5px 0;
        font-size: 0.74rem;
        text-decoration: none;
        color: inherit;
        border-bottom: 1px dotted rgba(92, 102, 120, 0.25);
      }
      a.idx-row:hover .idx-title { color: var(--blue); }
      .idx-n {
        font-weight: 800;
        color: var(--blue);
        font-size: 0.7rem;
      }
      .idx-title { font-weight: 600; }
      .idx-type {
        font-size: 0.58rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        white-space: nowrap;
      }
      .idx-ch {
        font-size: 0.58rem;
        font-weight: 700;
        color: var(--muted);
        white-space: nowrap;
      }

      /* Chapter divider */
      .chapter-page {
        display: grid;
        align-content: center;
        min-height: 9in;
        padding-left: 0.15in;
      }
      .chapter-page .ch-big {
        font-size: 5.5rem;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.05em;
        color: var(--ch-accent, var(--blue));
        opacity: 0.14;
        margin-bottom: -0.15in;
      }
      .chapter-page h2 {
        font-size: 1.75rem;
        margin: 0 0 10px;
        max-width: 5in;
      }
      .chapter-page p {
        margin: 0 0 24px;
        font-size: 0.88rem;
        color: var(--muted);
        max-width: 4.5in;
        line-height: 1.55;
      }
      .chapter-items { list-style: none; margin: 0; padding: 0; }
      .chapter-items li {
        display: grid;
        grid-template-columns: 36px 1fr;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
        font-size: 0.76rem;
      }
      .chapter-items .n {
        font-family: "Sora", sans-serif;
        font-weight: 800;
        color: var(--blue);
      }
      .chapter-items a {
        color: var(--ink);
        text-decoration: none;
        font-weight: 600;
      }
      .chapter-items a:hover { color: var(--blue); }
      .chapter-items small {
        display: block;
        margin-top: 2px;
        font-weight: 400;
        color: var(--muted);
        font-size: 0.66rem;
      }

      /* Agenda + hosts */
      .agenda { width: 100%; border-collapse: collapse; font-size: 0.76rem; margin-bottom: 20px; }
      .agenda th, .agenda td {
        padding: 9px 10px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }
      .agenda th {
        font-size: 0.6rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        background: #f8fbfd;
      }
      .agenda td:first-child {
        font-family: "Sora", sans-serif;
        font-weight: 800;
        color: var(--blue);
        width: 58px;
        white-space: nowrap;
      }
      .hosts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .host {
        padding: 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #fafcfe;
      }
      .host b { display: block; font-family: "Sora", sans-serif; font-size: 0.8rem; }
      .host span { display: block; font-size: 0.68rem; color: var(--muted); font-weight: 600; }
      .host-desc { font-size: 0.62rem; color: var(--muted); margin: 6px 0 0; line-height: 1.35; }

      /* QR reference */
      .qr-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin-top: 16px;
      }
      .qr-cell { text-align: center; }
      .qr-cell img {
        width: 80px;
        height: 80px;
        border-radius: 8px;
        border: 1px solid var(--line);
        padding: 3px;
      }
      .qr-cell b {
        display: block;
        margin-top: 6px;
        font-family: "Sora", sans-serif;
        font-size: 0.68rem;
      }
      .qr-cell code {
        display: block;
        margin-top: 2px;
        font-size: 0.55rem;
        color: var(--muted);
      }

      /* Digital browse (screen only) */
      .digital {
        width: min(920px, calc(100vw - 32px));
        margin: 0 auto;
        padding-bottom: 32px;
      }
      .digital-hero {
        text-align: center;
        padding: 32px 20px 24px;
        background: linear-gradient(160deg, var(--ink), #0d4a7a 50%, var(--blue));
        color: #fff;
        border-radius: 20px;
        margin-bottom: 24px;
      }
      .digital-hero h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
        font-weight: 800;
      }
      .digital-hero p { margin: 0; font-size: 0.86rem; opacity: 0.88; }
      .jump-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-bottom: 24px;
      }
      .jump-bar a {
        padding: 8px 14px;
        border-radius: 999px;
        background: #fff;
        border: 1px solid var(--line);
        font-family: "Sora", sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        text-decoration: none;
        color: var(--ink);
      }
      .jump-bar a:hover { border-color: var(--blue); color: var(--blue); }
      .dig-sec { margin-bottom: 28px; }
      .dig-sec h3 {
        margin: 0 0 12px;
        font-family: "Sora", sans-serif;
        font-size: 0.95rem;
      }
      .dig-card {
        display: block;
        padding: 14px 16px;
        margin-bottom: 10px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        text-decoration: none;
        color: inherit;
        transition: transform 0.2s, box-shadow 0.2s;
      }
      .dig-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 32px rgba(10, 22, 40, 0.08);
      }
      .dig-card .top {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 4px;
      }
      .dig-card .num {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: var(--ink);
        color: #fff;
        font-family: "Sora", sans-serif;
        font-size: 0.72rem;
        font-weight: 800;
      }
      .dig-card h4 { margin: 0; font-family: "Sora", sans-serif; font-size: 0.88rem; }
      .dig-card p { margin: 0; font-size: 0.76rem; color: var(--muted); line-height: 1.45; }
      .dig-card .tag {
        margin-left: auto;
        font-size: 0.58rem;
        font-weight: 800;
        text-transform: uppercase;
        color: var(--blue);
      }

      /* Booklet + shell integration */
      html[data-tff-shell="native"] .toolbar {
        z-index: 900;
      }

      @media (max-width: 768px) {
        .book {
          gap: 20px;
          padding: 16px 12px 0;
        }
        .page {
          width: calc(100vw - 24px);
          min-height: auto;
          padding: 0.42in 0.38in 0.58in;
        }
        .toolbar {
          padding: 10px 14px;
          gap: 8px;
        }
        .toolbar span {
          width: 100%;
          font-size: 0.72rem;
          line-height: 1.35;
        }
        .toolbar div { width: 100%; justify-content: flex-start; }
        .toolbar a, .toolbar button {
          padding: 8px 12px;
          font-size: 0.7rem;
        }
        .cover-title { font-size: 1.65rem; }
        .cover-bottom { grid-template-columns: 1fr; gap: 16px; }
        .how-grid, .hosts { grid-template-columns: 1fr; }
        .qr-grid { grid-template-columns: repeat(2, 1fr); }
        .idx-row {
          grid-template-columns: 28px 1fr auto;
          gap: 6px;
        }
        .idx-ch { display: none; }
        .chapter-page { min-height: auto; padding: 0.1in 0; }
        .chapter-page .ch-big { font-size: 3.5rem; }
        .jump-bar {
          position: sticky;
          top: 52px;
          z-index: 20;
          padding: 10px 0;
          background: linear-gradient(180deg, var(--paper) 70%, transparent);
        }
        .digital-hero { border-radius: 16px; padding: 24px 16px 20px; }
        .digital-hero h1 { font-size: 1.25rem; }
      }

      @media print {
        body { background: #fff; }
        .toolbar, .digital, .tff-shell-nav, .tff-shell-dock { display: none !important; }
        .book { gap: 0; padding: 0; }
        .page {
          width: 100%;
          min-height: auto;
          border: none;
          border-radius: 0;
          box-shadow: none;
          margin: 0;
        }
      }
      @media screen {
        .book { display: grid; }
        .page { border-radius: 12px; }
      }
      @page { size: letter portrait; margin: 0.45in; }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <span id="toolbar-meta"><strong>July 8 visit packet</strong> · scroll or jump below</span>
      <div>
        <a href="/prepare">Meeting prep</a>
        <a href="#digital-view">Quick jump</a>
        <a href="/mystery">Blind Flavor Mapping</a>
        <button type="button" class="primary" onclick="window.print()">Print</button>
      </div>
    </div>

    <div class="book" id="print-book"></div>

    <div class="digital" id="digital-view">
      <div class="digital-hero">
        <p style="margin:0 0 8px;font-size:0.65rem;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;opacity:0.75">July 8, 2026 · Norco</p>
        <h1>Quick jump · numbered index</h1>
        <p>Scroll the packet pages above, or open any item below by number. Start with <a href="/prepare" style="color:#fff;font-weight:700">meeting prep</a> for the suggested agenda and discussion topics.</p>
      </div>
      <nav class="jump-bar" id="jump-bar"></nav>
      <div id="digital-sections"></div>
    </div>

    <script src="/tff-team.js"></script>
    <script src="/tff-booklet-data.js"></script>
    <script>
      var B = window.TFFBooklet;
      var pageNum = 0;

      function nextPage() {
        pageNum++;
        return pageNum;
      }

      function foot(label) {
        return '<footer class="page-foot"><span>Prepared for Church &amp; Dwight / TheraBreath</span><span class="pg">' + label + '</span></footer>';
      }

      function buildCover() {
        return (
          '<section class="page">' +
          '<div class="cover">' +
          '<div class="cover-top">' +
          '<div class="cover-mark">TFF</div>' +
          '<p class="cover-kicker">July 8, 2026 · Norco, California</p>' +
          '<h1 class="cover-title">July 8 Visit Packet</h1>' +
          '<p class="cover-sub"><strong>Breath of Innovation</strong> — a capabilities workshop for TheraBreath R&amp;D and procurement. Use this index to find the agenda, discussion materials, and live tools for your visit. All times are suggested.</p>' +
          '<div class="cover-partners"><span>The Flavor Factory</span><i></i><span>TheraBreath</span></div>' +
          '</div>' +
          '<div class="cover-bottom">' +
          '<div class="cover-fields">' +
          '<label>Guest name</label><div class="line"></div>' +
          '<label>Title / department</label><div class="line"></div>' +
          '<label>Company</label><div class="line"></div>' +
          '</div>' +
          '<div class="cover-qr">' +
          '<img src="/assets/qr/booklet-sm.png" alt="QR — digital booklet index" width="96" height="96" />' +
          '<b>Scan for digital index</b>' +
          '<span>therabreath-visit-site.vercel.app/booklet</span>' +
          '</div>' +
          '</div>' +
          '</div>' +
          foot("Cover") +
          '</section>'
        );
      }

      function buildWelcome() {
        var hosts = B.hosts.map(function (h) {
          var desc = h.desc ? '<p class="host-desc">' + h.desc + "</p>" : "";
          return '<div class="host"><b>' + h.name + '</b><span>' + h.role + "</span>" + desc + "</div>";
        }).join("");
        var lastNum = String(B.items.length).padStart(2, "0");
        return (
          '<section class="page">' +
          '<p class="kicker">How to use this packet</p>' +
          '<h2>What to expect July 8</h2>' +
          '<p class="lead">This is a <strong>capabilities workshop</strong> — not a sales presentation. Your R&amp;D and procurement colleagues asked for a working review of resiliency, innovation, operations, and partnership, plus directional tasting on five mint platforms (M1–M5). Facility tour at 9:00, presentation at 9:30, tasting at 10:30, lunch off site, then open Q&amp;A.</p>' +
          '<p class="lead" style="margin-top:-8px">Start with <strong>item 03 · meeting prep</strong> for the suggested agenda and discussion highlights from your email threads. Use the numbered index to jump to PDFs or live site tools.</p>' +
          '<div class="how-grid">' +
          '<div class="how-card"><b>Find by number</b><p>Every item is numbered <strong>01–' + lastNum + '</strong>. Reference numbers in the room — e.g. “see item 16, Lakewood parity.”</p></div>' +
          '<div class="how-card"><b>Seven chapters</b><p>Partnership &amp; prep, schedule, operations, innovation, sensory, quality docs, and live tasting tools.</p></div>' +
          '<div class="how-card"><b>Phone + print</b><p>Scan the cover QR for this digital index. PDFs open in a new tab; live tools run on your phone at 10:30.</p></div>' +
          '<div class="how-card"><b>Come with questions</b><p>Technical, operational, and partnership topics are welcome throughout. Dan, Alex, Ryan, and Matt are your July 8 hosts.</p></div>' +
          '</div>' +
          '<p class="kicker" style="margin-top:8px">Your hosts</p>' +
          '<div class="hosts">' + hosts + '</div>' +
          foot("Overview · " + nextPage()) +
          '</section>'
        );
      }

      function buildAgendaPage() {
        var rows = B.agenda.map(function (a) {
          return '<tr><td>' + a.time + '</td><td><strong>' + a.label + '</strong><br><span style="color:var(--muted);font-size:0.68rem">' + a.note + '</span></td></tr>';
        }).join("");
        return (
          '<section class="page">' +
          '<p class="kicker">Suggested schedule</p>' +
          '<h2>Your day in Norco</h2>' +
          '<table class="agenda"><thead><tr><th>Time</th><th>Block</th></tr></thead><tbody>' + rows + '</tbody></table>' +
          '<p class="lead" style="margin-top:16px;font-size:0.78rem">Times adjust in the room to match your pace. Full agenda and discussion topics: <strong>therabreath-visit-site.vercel.app/prepare</strong></p>' +
          foot("Agenda · " + nextPage()) +
          '</section>'
        );
      }

      function chapterBlock(ch) {
        var items = B.items.filter(function (it) { return it.ch === ch.num; });
        var block =
          '<div class="ch-block">' +
          '<div class="ch-label"><span class="ch-num">' + String(ch.num).padStart(2, "0") + '</span>' +
          '<b>' + ch.title + '</b><span>' + ch.subtitle + '</span></div>';
        items.forEach(function (it) {
          block +=
            '<a class="idx-row" href="' + B.href(it) + '" target="' + (it.type === "pdf" ? "_blank" : "_self") + '">' +
            '<span class="idx-n">' + String(it.n).padStart(2, "0") + '</span>' +
            '<span class="idx-title">' + it.title + '</span>' +
            '<span class="idx-type">' + B.typeLabel(it) + '</span>' +
            '<span class="idx-ch">Ch.' + ch.num + '</span></a>';
        });
        return block + "</div>";
      }

      function buildIndexPages() {
        var splitAt = 4;
        var parts = [
          B.chapters.slice(0, splitAt).map(chapterBlock).join(""),
          B.chapters.slice(splitAt).map(chapterBlock).join("")
        ];
        return parts.map(function (part, i) {
          return (
            '<section class="page">' +
            '<div class="index-head">' +
            '<h2>Index · ' + (i + 1) + " of " + parts.length + '</h2>' +
            '<span>Items 01–' + String(B.items.length).padStart(2, "0") + ' · find by number</span></div>' +
            part +
            foot("Index · " + nextPage()) +
            '</section>'
          );
        }).join("");
      }

      function buildChapterPages() {
        return B.chapters.map(function (ch) {
          var items = B.items.filter(function (it) { return it.ch === ch.num; });
          var lis = items.map(function (it) {
            return '<li><span class="n">' + String(it.n).padStart(2, "0") + '</span><div>' +
              '<a href="' + B.href(it) + '" target="' + (it.type === "pdf" ? "_blank" : "_self") + '">' + it.title + '</a>' +
              '<small>' + it.desc + '</small></div></li>';
          }).join("");
          return (
            '<section class="page" style="--ch-accent:' + ch.accent + '">' +
            '<div class="chapter-page">' +
            '<div class="ch-big">' + String(ch.num).padStart(2, "0") + '</div>' +
            '<p class="kicker">Chapter ' + ch.num + '</p>' +
            '<h2>' + ch.title + '</h2>' +
            '<p>' + ch.subtitle + '</p>' +
            '<ul class="chapter-items">' + lis + '</ul>' +
            '</div>' +
            foot("Chapter " + ch.num + " · " + nextPage()) +
            '</section>'
          );
        }).join("");
      }

      function buildQrPage() {
        return (
          '<section class="page">' +
          '<p class="kicker">Quick reference</p>' +
          '<h2>Scan on your phone</h2>' +
          '<p class="lead">Use these during the 10:30 tasting block. Blind Flavor Mapping first, then Prototype Scorecard after reveals.</p>' +
          '<div class="qr-grid">' +
          '<div class="qr-cell"><img src="/assets/qr/booklet-sm.png" alt="" width="80" height="80" /><b>Packet index</b><code>/booklet</code></div>' +
          '<div class="qr-cell"><img src="/assets/qr/visit-sm.png" alt="" width="80" height="80" /><b>Meeting prep</b><code>/prepare</code></div>' +
          '<div class="qr-cell"><img src="/assets/qr/site-sm.png" alt="" width="80" height="80" /><b>Day-of hub</b><code>/visit</code></div>' +
          '<div class="qr-cell"><img src="/assets/qr/mystery-sm.png" alt="" width="80" height="80" /><b>27 Blind mapping</b><code>/mystery</code></div>' +
          '<div class="qr-cell"><img src="/assets/qr/score-sm.png" alt="" width="80" height="80" /><b>28 Scorecard</b><code>/score</code></div>' +
          '<div class="qr-cell"><img src="/assets/qr/passport-sm.png" alt="" width="80" height="80" /><b>06 Passport</b><code>/passport</code></div>' +
          '</div>' +
          '<p style="margin-top:24px;font-size:0.72rem;color:var(--muted);line-height:1.55">' +
          '<strong>The Flavor Factory</strong> · 2058 Second Street, Norco, CA 92860 · (951) 273-9877<br />' +
          'Prepared for Church &amp; Dwight / TheraBreath · July 8, 2026</p>' +
          foot("QR reference · " + nextPage()) +
          '</section>'
        );
      }

      function buildDigital() {
        var jumps = B.chapters.map(function (ch) {
          return '<a href="#ch-' + ch.num + '">Ch. ' + ch.num + ' · ' + ch.title.split(" ")[0] + '</a>';
        }).join("");
        document.getElementById("jump-bar").innerHTML = jumps;

        var secs = B.chapters.map(function (ch) {
          var items = B.items.filter(function (it) { return it.ch === ch.num; });
          var cards = items.map(function (it) {
            return (
              '<a class="dig-card" href="' + B.href(it) + '" target="' + (it.type === "pdf" ? "_blank" : "_self") + '">' +
              '<div class="top"><span class="num">' + String(it.n).padStart(2, "0") + '</span>' +
              '<h4>' + it.title + '</h4><span class="tag">' + B.typeLabel(it) + '</span></div>' +
              '<p>' + it.desc + '</p></a>'
            );
          }).join("");
          return (
            '<section class="dig-sec" id="ch-' + ch.num + '">' +
            '<h3>Chapter ' + ch.num + ' · ' + ch.title + '</h3>' + cards +
            '</section>'
          );
        }).join("");
        document.getElementById("digital-sections").innerHTML = secs;
      }

      pageNum = 0;
      document.getElementById("print-book").innerHTML =
        buildCover() +
        buildWelcome() +
        buildAgendaPage() +
        buildIndexPages() +
        buildChapterPages() +
        buildQrPage();

      buildDigital();

      var meta = document.getElementById("toolbar-meta");
      if (meta) {
        meta.innerHTML = "<strong>July 8 visit packet</strong> · " + B.items.length + " items · " + B.chapters.length + " chapters · scroll or jump below";
      }
    </script>
    <script src="/tff-shell.js" defer></script>
  </body>
</html>
